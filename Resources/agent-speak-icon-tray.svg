<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1254 1254">
  <defs>
    <linearGradient id="blue" x1="0.10" y1="0.02" x2="0.90" y2="1">
      <stop offset="0" stop-color="#27D8F3"/>
      <stop offset="0.52" stop-color="#149AF0"/>
      <stop offset="1" stop-color="#063BD5"/>
    </linearGradient>

    <linearGradient id="glass" x1="0.12" y1="0.04" x2="0.86" y2="0.96">
      <stop offset="0" stop-color="#F8FDFF" stop-opacity=".94"/>
      <stop offset=".36" stop-color="#C8EEFF" stop-opacity=".76"/>
      <stop offset=".72" stop-color="#8BD8FF" stop-opacity=".66"/>
      <stop offset="1" stop-color="#B9C9FF" stop-opacity=".70"/>
    </linearGradient>

    <linearGradient id="bars" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DFE9FF"/>
    </linearGradient>

    <radialGradient id="violetGlow" cx="72%" cy="80%" r="38%">
      <stop offset="0" stop-color="#A95CFF" stop-opacity=".52"/>
      <stop offset=".55" stop-color="#657CFF" stop-opacity=".16"/>
      <stop offset="1" stop-color="#657CFF" stop-opacity="0"/>
    </radialGradient>

    <filter id="bubbleShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="11" stdDeviation="13" flood-color="#0042B7" flood-opacity=".22"/>
    </filter>

    <filter id="barShadow" x="-30%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#174DBA" flood-opacity=".20"/>
    </filter>
  </defs>

  <!-- Exact original-style square tile proportions -->
  <rect x="43" y="50" width="1168" height="1158" rx="181" fill="url(#blue)"/>

  <!-- original-style luminous cyan edge -->
  <rect x="48" y="55" width="1158" height="1148" rx="176"
        fill="none" stroke="#5CEEFF" stroke-opacity=".64" stroke-width="7"/>

  <!-- inner highlight following the tile edge -->
  <path d="M111 116 C166 70 240 62 326 62 H920
           C1050 62 1131 93 1174 147"
        fill="none" stroke="#C5FAFF" stroke-opacity=".20"
        stroke-width="25" stroke-linecap="round"/>

  <!-- THE BUBBLE: positioned to match the supplied original,
       with a deliberate, clean gap above the bottom of the square -->
  <g filter="url(#bubbleShadow)">
    <path d="
      M143 603
      C143 382 328 183 616 183
      C903 183 1092 366 1092 602
      C1092 832 906 987 632 988
      C565 988 507 978 458 962
      L261 1054
      C244 1062 215 1050 219 1030
      L259 897
      C184 817 143 719 143 603 Z"
      fill="url(#glass)"
      stroke="#FFFFFF" stroke-opacity=".96" stroke-width="7"
      stroke-linejoin="round"/>

    <!-- glass reflection, following the ORIGINAL orientation -->
    <path d="M238 493
             C304 315 465 218 650 218
             C826 218 975 307 1030 470"
          fill="none"
          stroke="#FFFFFF" stroke-opacity=".30"
          stroke-width="31" stroke-linecap="round"/>

    <!-- original lower-right purple/cyan light -->
    <path d="M480 900 C630 1005 900 982 1030 820
             C986 930 856 982 675 982 C592 982 526 968 480 950 Z"
          fill="url(#violetGlow)"/>
  </g>

  <!-- centered waveform: five bars, same orientation and hierarchy -->
  <g fill="url(#bars)" filter="url(#barShadow)">
    <rect x="340" y="560" width="75" height="143" rx="37.5"/>
    <rect x="458" y="494" width="76" height="281" rx="38"/>
    <rect x="580" y="396" width="77" height="461" rx="38.5"/>
    <rect x="711" y="494" width="76" height="281" rx="38"/>
    <rect x="835" y="560" width="75" height="143" rx="37.5"/>
  </g>
</svg>